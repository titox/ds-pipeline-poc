<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 962" role="img"><title>Flow of the ship-component skill</title><desc>Five phases run top to bottom: inputs, build, check, documentation, close. Build and check belong to the development team in the real process; the skill does them for the demo. After the check a gate asks whether the scorecard passes. If not, the design is fixed in Figma and the run returns to build. Then the designer checks the built component, agrees the documentation text, and the design system lead approves the draft. Six points need a person.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1f1f}
.th{font-size:14px;font-weight:600}.ts{font-size:12px;fill:#555}
.arr{stroke:#666;stroke-width:1.5;fill:none}
rect{fill:#f4f4f2;stroke:#888}
.c-purple rect,rect.c-purple{fill:#eeebfb;stroke:#6a55c8}
.c-blue rect,rect.c-blue{fill:#e6f0fb;stroke:#2f6fb5}
.c-amber rect,rect.c-amber{fill:#fdf1d8;stroke:#b07a10}
</style><rect x="0" y="0" width="680" height="962" style="fill:#fff;stroke:none"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node"><rect class="box" x="60" y="40" width="280" height="44" rx="8" stroke-width="0.5"/><text class="th" x="200" y="62" text-anchor="middle" dominant-baseline="central">You send a Figma link</text></g>
<line x1="200" y1="84" x2="200" y2="114" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="60" y="124" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="142" text-anchor="middle" dominant-baseline="central">1. Inputs</text><text class="ts" x="200" y="162" text-anchor="middle" dominant-baseline="central">Exports, illustrations, Jira hand-off</text></g>
<line x1="200" y1="180" x2="200" y2="210" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="420" y="124" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="142" text-anchor="middle" dominant-baseline="central">Exports current?</text><text class="ts" x="530" y="162" text-anchor="middle" dominant-baseline="central">Designer: or a new RubyLint export</text></g>
<line x1="420" y1="152" x2="350" y2="152" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="220" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="238" text-anchor="middle" dominant-baseline="central">2. Build</text><text class="ts" x="200" y="258" text-anchor="middle" dominant-baseline="central">Tokens, React, Code Connect, stories</text></g>
<line x1="200" y1="276" x2="200" y2="306" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="316" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="334" text-anchor="middle" dominant-baseline="central">3. Check</text><text class="ts" x="200" y="354" text-anchor="middle" dominant-baseline="central">Lint, Storybook vs Figma, review</text></g>
<line x1="200" y1="372" x2="200" y2="402" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="60" y="412" width="280" height="56" rx="8" stroke-width="1.5"/><text class="th" x="200" y="430" text-anchor="middle" dominant-baseline="central">Gate: does the scorecard pass?</text><text class="ts" x="200" y="450" text-anchor="middle" dominant-baseline="central">Yes goes down, no goes right</text></g>
<line x1="200" y1="468" x2="200" y2="498" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="420" y="412" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="430" text-anchor="middle" dominant-baseline="central">Fix the design in Figma</text><text class="ts" x="530" y="450" text-anchor="middle" dominant-baseline="central">Designer: uses the failure report</text></g>
<line x1="340" y1="440" x2="410" y2="440" class="arr" marker-end="url(#arrow)"/>
<path d="M530 412 L530 248 L350 248" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="60" y="508" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="526" text-anchor="middle" dominant-baseline="central">Design check</text><text class="ts" x="200" y="546" text-anchor="middle" dominant-baseline="central">Built component against Figma</text></g>
<line x1="200" y1="564" x2="200" y2="594" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="420" y="508" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="526" text-anchor="middle" dominant-baseline="central">Approve the build</text><text class="ts" x="530" y="546" text-anchor="middle" dominant-baseline="central">Designer: in Storybook</text></g>
<line x1="420" y1="536" x2="350" y2="536" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="60" y="604" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="622" text-anchor="middle" dominant-baseline="central">4. Documentation</text><text class="ts" x="200" y="642" text-anchor="middle" dominant-baseline="central">Source, preview, Supernova draft</text></g>
<line x1="200" y1="660" x2="200" y2="690" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="420" y="604" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="622" text-anchor="middle" dominant-baseline="central">Agree the text</text><text class="ts" x="530" y="642" text-anchor="middle" dominant-baseline="central">Designer: then approves credits</text></g>
<line x1="420" y1="632" x2="350" y2="632" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="60" y="700" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="718" text-anchor="middle" dominant-baseline="central">Draft review</text><text class="ts" x="200" y="738" text-anchor="middle" dominant-baseline="central">Before anything is published</text></g>
<line x1="200" y1="756" x2="200" y2="786" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="420" y="700" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="718" text-anchor="middle" dominant-baseline="central">Approve the draft</text><text class="ts" x="530" y="738" text-anchor="middle" dominant-baseline="central">Design system lead</text></g>
<line x1="420" y1="728" x2="350" y2="728" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="60" y="796" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="814" text-anchor="middle" dominant-baseline="central">5. Close</text><text class="ts" x="200" y="834" text-anchor="middle" dominant-baseline="central">Code Connect, commit, deploy, log</text></g>
<g class="node c-amber"><rect x="420" y="796" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="814" text-anchor="middle" dominant-baseline="central">Approve the publish</text><text class="ts" x="530" y="834" text-anchor="middle" dominant-baseline="central">Designer: Code Connect in Dev Mode</text></g>
<line x1="420" y1="824" x2="350" y2="824" class="arr" marker-end="url(#arrow)"/>
<rect class="c-purple" x="60" y="898" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="82" y="905" dominant-baseline="central">The skill works alone</text>
<rect class="c-blue" x="60" y="918" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="82" y="925" dominant-baseline="central">Development team's part; the skill does it for the demo</text>
<rect class="c-amber" x="60" y="938" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="82" y="945" dominant-baseline="central">It stops and needs a person</text>
</svg>
